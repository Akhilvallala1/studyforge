[project]
name = "studyforge-backend"
version = "0.1.0"
description = "StudyForge backend: document ingestion, course generation, and progress API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the FastAPI dependency idiom.
ignore = ["B008"]
